name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  # Superseded PR runs are cancelled. A main or tag run may be publishing
  # images and a release, so it always runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/looneman1/voxhold-backend

jobs:
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      minor: ${{ steps.plan.outputs.minor }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test release planning
        run: python3 .github/scripts/test-release-plan.py
      - name: Validate version and release eligibility
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-plan.py

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Classify changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        # Documentation-only PRs skip tests and image builds. Skipped required
        # jobs report success, so these PRs still merge. Any doubt runs everything.
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" || [ -z "$files" ]; then
            echo '::warning::Cannot list changed files; running every check.'
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Evq '(\.md$|^docs/|^LICENSE$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo 'Documentation-only change: tests and image builds are skipped.'
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # The full test suite runs in test-race and test-leaks; this job keeps the
  # required "Test" check for static analysis instead of a third identical run.
  test:
    name: Test
    needs: changes
    # Runs unless the change is documentation-only; a failed classification
    # leaves the output empty and therefore runs the checks.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check reachable vulnerabilities (Linux production packages)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/... ./internal/...

  test-race:
    name: Test with race detector
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race ./...

  test-leaks:
    name: Goroutine leak checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with Go 1.27 runtime leak detection
        env:
          VOXHOLD_CHECK_GOROUTINE_LEAKS: '1'
          VOXHOLD_LEAK_REPORT_DIR: ${{ github.workspace }}/leak-reports
        run: go test -count=1 ./... -timeout 120s
      - name: Retain leak stack reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goroutine-leak-reports
          path: leak-reports/
          if-no-files-found: ignore
          retention-days: 7

  container-variants:
    name: Build Docker image (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: amd64-v1
            platform: linux/amd64
            goamd64: v1
            scope: amd64-v1
          - name: amd64-v3
            platform: linux/amd64
            goamd64: v3
            scope: amd64-v3
          # Release builds publish ARM64; validate it before a release PR.
          - name: arm64
            platform: linux/arm64
            goamd64: v1
            scope: arm64

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GOAMD64=${{ matrix.goamd64 }}
          push: false
          load: true
          tags: voxhold-backend:ci-${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          provenance: false
          sbom: false

      - name: Check image CPU requirements without database access
        if: matrix.platform == 'linux/amd64'
        env:
          GOAMD64: ${{ matrix.goamd64 }}
          IMAGE: voxhold-backend:ci-${{ matrix.name }}
        run: |
          if [ "$GOAMD64" = v3 ] && ! /lib64/ld-linux-x86-64.so.2 --help | grep -Fq 'x86-64-v3 (supported, searched)'; then
            echo 'Runner lacks v3; image was built, execution is covered on compatible hosts.'
            exit 0
          fi
          docker run --rm --network none --read-only "$IMAGE" voxhold --check-cpu | grep -Fx "arch=amd64 level=$GOAMD64"
          count=$(docker run --rm --entrypoint sh "$IMAGE" -c 'find /usr/local/bin -name voxhold -type f | wc -l')
          test "$count" -eq 1

      - name: Check cross-compiled ARM64 executables
        if: matrix.platform == 'linux/arm64'
        env:
          IMAGE: voxhold-backend:ci-${{ matrix.name }}
        run: |
          container=$(docker create "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for binary in voxhold voxhold-bootstrap migrate; do
            docker cp "$container:/usr/local/bin/$binary" "$RUNNER_TEMP/$binary"
            file "$RUNNER_TEMP/$binary" | tee /dev/stderr | grep -Fq 'ARM aarch64'
          done

  container:
    name: Build Docker image
    if: always() && github.event_name == 'pull_request'
    needs: [changes, container-variants]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.container-variants.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: test "$RESULT" = success || { test "$RESULT" = skipped && test "$CODE" = false; }

  publish:
    name: Publish Docker image (${{ matrix.variant }})
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.release-plan.outputs.release == 'true'
    needs: [release-plan, test, test-race, test-leaks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The AMD64 half of the portable image is the v1 build, so the
          # -amd64-v1 tags are aliases of this image instead of a second build.
          - variant: portable
            goamd64: v1
            platforms: linux/amd64,linux/arm64
            suffix: ''
            alias: '-amd64-v1'
          - variant: amd64-v3
            goamd64: v3
            platforms: linux/amd64
            suffix: '-amd64-v3'
            alias: ''

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The builder stage runs natively; QEMU only runs the small final-stage
      # RUN for ARM64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-plan.outputs.version }}${{ matrix.suffix }},priority=900
            type=raw,value=${{ needs.release-plan.outputs.minor }}${{ matrix.suffix }},priority=800
            type=raw,value=latest${{ matrix.suffix }},priority=700
            type=raw,value=${{ needs.release-plan.outputs.version }}${{ matrix.alias }},priority=600,enable=${{ matrix.alias != '' }}
            type=raw,value=${{ needs.release-plan.outputs.minor }}${{ matrix.alias }},priority=500,enable=${{ matrix.alias != '' }}
            type=raw,value=latest${{ matrix.alias }},priority=400,enable=${{ matrix.alias != '' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          build-args: GOAMD64=${{ matrix.goamd64 }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.release-plan.outputs.release == 'true'
    needs: [release-plan, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-plan.outputs.tag }}
          RELEASE_TITLE: Voxhold Backend ${{ needs.release-plan.outputs.tag }}
        run: bash .github/scripts/publish-release.sh
