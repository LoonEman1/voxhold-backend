services:
  migrate:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION}

    env_file:
      - .env

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        mkdir -p "$$(dirname "$$DATABASE_PATH")"

        if [ "$$RESET_DATABASE" = "true" ]; then
          echo "resetting SQLite database"

          rm -f \
            "$$DATABASE_PATH" \
            "$$DATABASE_PATH-wal" \
            "$$DATABASE_PATH-shm"
        fi

        echo "applying migrations"

        exec migrate \
          -path "$$MIGRATIONS_PATH" \
          -database "sqlite://$$DATABASE_PATH" \
          up

    volumes:
      - voxhold_data:/app/data

    networks:
      - backend

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION}

    env_file:
      - .env

    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
      - "${WEBRTC_STREAM_UDP_PORT:-50001}:${WEBRTC_STREAM_UDP_PORT:-50001}/udp"

    depends_on:
      bootstrap:
        condition: service_completed_successfully

    volumes:
      - voxhold_data:/app/data

    networks:
      - backend

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${HTTP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bootstrap:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION}

    env_file:
      - .env

    entrypoint:
      - voxhold-bootstrap

    depends_on:
      migrate:
        condition: service_completed_successfully

    volumes:
      - voxhold_data:/app/data

    networks:
      - backend

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  voxhold_data:

networks:
  backend:
    internal: true
